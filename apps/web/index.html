<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F1626" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F5F6F8" media="(prefers-color-scheme: light)" />
    <meta name="description" content="Kosh — a treasury for your links, repos, skills, prompts and files. One curated library for your AI toolbox." />
    <title>Kosh — your AI toolbox, curated</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath d='M11 8v16M11 16l8-8M11 16l8 8' stroke='%23fff' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kosh" />
    <script src="/theme-init.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only the weights the UI uses (400/500/600/700 + 400 italic): 18 Poppins faces made every cold
         phone load paint in the fallback and reflow when the fonts landed. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root">
      <!-- Pre-React bootstrap shell: painted the instant the document parses so a cold load shows the
           topbar frame + a progress line instead of a blank background for the whole script-load window.
           React's createRoot replaces #root's contents on mount. Colors mirror index.css :root and the
           theme-color metas above (this is the bootstrap layer, kept out of the tokenized React UI). -->
      <style>
        #boot { position: fixed; inset: 0; background: #f5f6f8; }
        html.dark #boot { background: #0f1626; }
        #boot-bar { height: 64px; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid rgba(15, 22, 38, 0.08); }
        html.dark #boot-bar { border-color: rgba(255, 255, 255, 0.07); }
        #boot-logo { width: 32px; height: 32px; border-radius: 8px; background: #4f46e5; }
        #boot-track { height: 2px; overflow: hidden; }
        #boot-line { height: 100%; width: 32%; background: #4f46e5; animation: boot-slide 1.1s ease-in-out infinite; }
        @keyframes boot-slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(420%); } }
        @media (prefers-reduced-motion: reduce) { #boot-line { animation: none; width: 100%; opacity: 0.4; } }
      </style>
      <div id="boot" aria-hidden="true">
        <div id="boot-bar"><div id="boot-logo"></div></div>
        <div id="boot-track"><div id="boot-line"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
